name: Re-identify retained source snapshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Re-identify current search inputs from retained raw snapshots
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        run: |
          PROCESSED_AT=$(date --iso-8601=seconds)
          python3 -m src.reidentify_sources . --output /tmp/reidentify-times.json
          python3 -m src.resolve_osm_candidates .
          WAM_RETRIEVED_AT=$(python3 -c 'import json; print(json.load(open("/tmp/reidentify-times.json"))["wamRetrievedAt"])')
          OSM_RETRIEVED_AT=$(python3 -c 'import json; print(json.load(open("/tmp/reidentify-times.json"))["osmRetrievedAt"])')
          python3 -m src.facility_data update . --source wam --at "$WAM_RETRIEVED_AT" --sync-search-names --name-sync-at "$PROCESSED_AT" --decision-at "$PROCESSED_AT"
          python3 -m src.facility_data update . --source openstreetmap --at "$OSM_RETRIEVED_AT" --decision-at "$PROCESSED_AT"
      - run: python3 -m src.facility_data validate .
      - run: python3 -m unittest discover -s tests -v
      - name: Verify canonical JSON-LD data
        run: |
          cp data/places.jsonld /tmp/places.jsonld
          python3 -m src.facility_data build .
          python3 -m src.fac_cli jsonld-validate data/places.jsonld
          cmp /tmp/places.jsonld data/places.jsonld
      - name: Produce review diff and editable YAML
        run: |
          git add -N .
          git diff --binary > reports/reidentify-update.diff
          python3 -m src.github_osm_review build . \
            --output /tmp/osm-review-issue.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          document = json.load(open('/tmp/osm-review-issue.json', encoding='utf-8'))
          print(f"review_needed={'true' if document['reviewNeeded'] else 'false'}")
          PY
        id: review
      - name: Save generated update for review
        uses: actions/upload-artifact@v4
        with:
          name: reidentify-update-${{ github.run_id }}
          retention-days: 30
          path: |
            inputs/osm-search/
            imports/wam/normalized.json
            imports/openstreetmap/
            data/places.jsonld
            reports/latest-update.json
            reports/osm-candidates.json
            reports/osm-review-needed.json
            reports/osm-review-needed.yaml
            reports/reidentify-update.diff
      - name: Create editable review branch
        id: review-branch
        if: steps.review.outputs.review_needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/osm-review-reidentify-update-${{ github.run_id }}
          delete-branch: true
          draft: true
          commit-message: "data: prepare OSM human review"
          title: "data: prepare OSM human review"
          add-paths: reports/osm-review-needed.yaml
          body: |
            この下書きPull RequestはOSM候補の人間確認用です。
            `reports/osm-review-needed.yaml`を編集・コミットして、このPull Requestをmergeしてください。
            merge後に、commit済みYAMLと元artifactを照合するworkflowが適用用Pull Requestを作成します。
      - name: Create Pull Request when all candidates were resolved automatically
        if: steps.review.outputs.review_needed == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/reidentify-${{ github.run_id }}
          delete-branch: true
          commit-message: "data: re-identify retained source snapshots"
          title: "data: re-identify retained source snapshots"
          body: |
            Re-identifies the edited search inputs from the retained WAM and OpenStreetMap raw snapshots without external retrieval.

            Raw bytes and retrieval metadata were hash-verified and left unchanged. Validation and unit tests passed in the producing workflow.
