name: Validate data

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate repository data
        run: python3 -m src.facility_data validate .
      - name: Verify generated public data
        run: |
          cp dist/public/places.geojson /tmp/places.geojson
          cp dist/public/manifest.json /tmp/manifest.json
          python3 -m src.facility_data build .
          cmp /tmp/places.geojson dist/public/places.geojson
          cmp /tmp/manifest.json dist/public/manifest.json
