name: Close completed OSM review draft

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  close-draft:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Close the recorded draft review
        uses: actions/github-script@v7
        with:
          script: |
            const { closeRecordedDraftReview } = require('./scripts/close_osm_review_draft.js');
            await closeRecordedDraftReview({
              body: context.payload.pull_request.body,
              baseRef: context.payload.pull_request.base.ref,
              owner: context.repo.owner,
              repo: context.repo.repo,
              github,
              core,
            });
