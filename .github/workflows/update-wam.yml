name: Update WAM data

on:
  workflow_dispatch:
    inputs:
      release:
        description: WAM release (YYYYMM)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Retrieve WAM release
        id: retrieve
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          RETRIEVED_AT=$(date --iso-8601=seconds)
          python3 -m src.retrieve_wam . --release "$RELEASE" --at "$RETRIEVED_AT"
          echo "retrieved_at=$RETRIEVED_AT" >> "$GITHUB_OUTPUT"
      - name: Verify retained WAM raw snapshot hash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from src.reidentify_sources import _verified_snapshot

          _verified_snapshot(Path("."), "wam")
          PY
      - name: Update canonical data from verified WAM snapshot
        env:
          RETRIEVED_AT: ${{ steps.retrieve.outputs.retrieved_at }}
        run: python3 -m src.facility_data update . --source wam --at "$RETRIEVED_AT"
      - run: python3 -m src.facility_data validate .
      - run: python3 -m unittest discover -s tests -v
      - name: Verify canonical JSON-LD data
        run: |
          cp data/places.jsonld /tmp/places.jsonld
          python3 -m src.facility_data build .
          python3 -m src.fac_cli jsonld-validate data/places.jsonld
          cmp /tmp/places.jsonld data/places.jsonld
      - name: Produce review diff
        run: |
          git add -N .
          git diff --binary > reports/wam-update.diff
      - name: Retain generated provenance for machine validation
        uses: actions/upload-artifact@v4
        with:
          name: wam-update-${{ inputs.release }}
          retention-days: 14
          path: |
            inputs/osm-search/wam/
            imports/wam/
            data/places.jsonld
            reports/latest-update.json
            reports/wam-update.diff
      - name: Create reviewable Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/wam-update-${{ github.run_id }}
          delete-branch: true
          commit-message: "data: update WAM snapshot"
          title: "data: update WAM snapshot"
          body: |
            このPull RequestはGitHub Actionsが取得、正規化、検証したWAM更新です。

            生データはSHA-256で検証する内部来歴です。候補JSON-LDとPull Requestの差分をreviewしてください。
