name: Validate WAM snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m unittest tests.test_facility_data.SourceUpdateTests -v
      - run: python3 -m src.facility_data validate .
