name: Apply merged OSM human review

on:
  pull_request:
    types: [closed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: osm-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'automation/osm-review-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read the merged review PR identity
        id: review
        env:
          REVIEW_BRANCH: ${{ github.head_ref }}
        run: |
          ARTIFACT_NAME="${REVIEW_BRANCH#automation/osm-review-}"
          case "$ARTIFACT_NAME" in
            osm-update-[0-9]*|reidentify-update-[0-9]*) ;;
            *) echo "invalid OSM review branch: $REVIEW_BRANCH" >&2; exit 1 ;;
          esac
          RUN_ID="${ARTIFACT_NAME##*-}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Preserve committed review YAML and download its exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.review.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.review.outputs.artifact_name }}
        run: |
          cp reports/osm-review-needed.yaml /tmp/osm-review-needed.yaml
          mkdir -p /tmp/osm-review-artifact
          gh run download "$RUN_ID" --name "$ARTIFACT_NAME" --dir /tmp/osm-review-artifact
          cp -a /tmp/osm-review-artifact/. .
          cp /tmp/osm-review-needed.yaml reports/osm-review-needed.yaml
      - name: Apply committed choices and rebuild canonical data
        env:
          REVIEW_URL: ${{ github.event.pull_request.html_url }}
        run: |
          DECISION_AT=$(date --iso-8601=seconds)
          python3 -m src.github_osm_review apply-yaml . \
            --yaml reports/osm-review-needed.yaml \
            --review-url "$REVIEW_URL"
          OSM_RETRIEVED_AT=$(python3 -c 'import json; print(json.load(open("imports/openstreetmap/retrieval.json"))["retrievedAt"])')
          python3 -m src.facility_data update . --source openstreetmap --at "$OSM_RETRIEVED_AT" --decision-at "$DECISION_AT"
      - run: python3 -m src.facility_data validate .
      - run: python3 -m unittest discover -s tests -v
      - name: Verify canonical JSON-LD data
        run: |
          cp data/places.jsonld /tmp/places.jsonld
          python3 -m src.facility_data build .
          python3 -m src.fac_cli jsonld-validate data/places.jsonld
          cmp /tmp/places.jsonld data/places.jsonld
      - name: Create production Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/osm-human-review-${{ github.event.pull_request.number }}
          delete-branch: true
          commit-message: "data: apply merged OSM review #${{ github.event.pull_request.number }}"
          title: "data: apply merged OSM review #${{ github.event.pull_request.number }}"
          body: |
            Applies the committed selections from the merged OSM review Pull Request.

            The workflow downloaded the originating Actions artifact, verified the review YAML candidate-report SHA-256 binding, rejected duplicate OSM assignments, validated canonical JSON-LD, and ran unit tests.
