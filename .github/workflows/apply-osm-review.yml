name: Apply OSM human review

on:
  issues:
    types: [edited]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    if: >-
      contains(github.event.issue.body, '<!-- osm-review-metadata:') &&
      contains(github.event.issue.body, '- [x] <!-- osm-apply -->')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read immutable artifact reference from the issue
        id: metadata
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 -m src.github_osm_review metadata --event "$EVENT_PATH" > /tmp/osm-review-metadata.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          metadata = json.load(open('/tmp/osm-review-metadata.json', encoding='utf-8'))
          print(f"run_id={metadata['runId']}")
          print(f"artifact_name={metadata['artifactName']}")
          print(f"review_branch={metadata.get('reviewBranch', '')}")
          PY
      - name: Download the exact reviewed Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.metadata.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact_name }}
        run: |
          mkdir -p /tmp/osm-review-artifact
          gh run download "$RUN_ID" --name "$ARTIFACT_NAME" --dir /tmp/osm-review-artifact
          cp -a /tmp/osm-review-artifact/. .
      - name: Download committed review YAML
        if: steps.metadata.outputs.review_branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: ${{ steps.metadata.outputs.review_branch }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/contents/reports/osm-review-needed.yaml?ref=${REVIEW_BRANCH}" --jq .content \
            | base64 --decode > /tmp/osm-review-needed.yaml
      - name: Apply checked choices and rebuild canonical data
        env:
          EVENT_PATH: ${{ github.event_path }}
          REVIEW_BRANCH: ${{ steps.metadata.outputs.review_branch }}
        run: |
          DECISION_AT=$(date --iso-8601=seconds)
          if [ -n "$REVIEW_BRANCH" ]; then
            python3 -m src.github_osm_review apply-yaml . --event "$EVENT_PATH" --yaml /tmp/osm-review-needed.yaml
          else
            python3 -m src.github_osm_review apply . --event "$EVENT_PATH"
          fi
          OSM_RETRIEVED_AT=$(python3 -c 'import json; print(json.load(open("imports/openstreetmap/retrieval.json"))["retrievedAt"])')
          python3 -m src.facility_data update . --source openstreetmap --at "$OSM_RETRIEVED_AT" --decision-at "$DECISION_AT"
      - run: python3 -m src.facility_data validate .
      - run: python3 -m unittest discover -s tests -v
      - name: Verify generated public data
        run: |
          cp dist/public/places.geojson /tmp/places.geojson
          cp dist/public/manifest.json /tmp/manifest.json
          python3 -m src.facility_data build .
          cmp /tmp/places.geojson dist/public/places.geojson
          cmp /tmp/manifest.json dist/public/manifest.json
      - name: Create reviewable Pull Request
        id: pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/osm-human-review-${{ github.event.issue.number }}
          delete-branch: true
          commit-message: "data: apply OSM review from issue #${{ github.event.issue.number }}"
          title: "data: apply OSM review from issue #${{ github.event.issue.number }}"
          body: |
            Applies the checked OSM candidate decisions from #${{ github.event.issue.number }}.

            The workflow re-downloaded the originating Actions artifact, verified its candidate-report SHA, rebuilt the canonical registry and public GeoJSON, and ran validation and unit tests.
      - name: Link the Pull Request and close the completed issue
        if: steps.pull-request.outputs.pull-request-url != ''
        uses: actions/github-script@v7
        env:
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `選択を検証し、Pull Requestを作成しました: ${process.env.PR_URL}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
