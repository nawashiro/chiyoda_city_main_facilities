name: Update OpenStreetMap data

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: osm-maintenance
  cancel-in-progress: false

jobs:
  process:
    if: github.event_name != 'issues' || contains(github.event.issue.body, '<!-- osm-review:')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.update.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install -r .github/requirements-osm.txt
      - name: Update, validate and commit latest main
        id: update
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          UPDATE_MODE: ${{ github.event_name == 'issues' && 'confirm' || 'refresh' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -m src.osm_maintenance "$UPDATE_MODE" .
          python3 -m src.facility_data validate .
          python3 -m unittest discover -s tests -v
          python3 -m src.facility_data build .
          ./fac jsonld-validate site/places.jsonld
          git add data/places.jsonld data/osm-decisions.json imports/openstreetmap/
          if ! git diff --cached --quiet; then
            git commit -m '[bot] data: update OSM associations'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Present committed decisions
        if: github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m src.osm_maintenance present .
  publish:
    needs: process
    uses: ./.github/workflows/publish-pages.yml
    with:
      sha: ${{ needs.process.outputs.sha }}
  close-reviews:
    needs: [process, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.process.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Close decisions after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m src.osm_maintenance close-published .
