name: Release JSON-LD snapshot

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for a manual dry-run
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-jsonld:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate canonical JSON-LD
        run: python3 -m src.fac_cli jsonld-validate data/places.jsonld
      - name: Prepare release JSON-LD snapshot
        run: python3 scripts/prepare_release_jsonld.py --input data/places.jsonld --output-dir release --version "$RELEASE_TAG"
      - name: Upload JSON-LD snapshot
        uses: actions/upload-artifact@v4
        with:
          name: release-jsonld-${{ env.RELEASE_TAG }}
          path: release/*.jsonld
          if-no-files-found: error
      - name: Attach JSON-LD snapshot to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release/*.jsonld
          token: ${{ secrets.GITHUB_TOKEN }}
