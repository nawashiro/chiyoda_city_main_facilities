name: Update town polygons

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA from nawashiro/chiyoda_city_town_geojson
        required: true
        type: string

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Retrieve town polygons and rebuild public data
        env:
          TOWN_COMMIT: ${{ inputs.commit }}
        run: |
          RETRIEVED_AT=$(date --iso-8601=seconds)
          python3 -m src.retrieve_towns . --commit "$TOWN_COMMIT" --at "$RETRIEVED_AT"
          python3 -m src.facility_data build .
      - run: python3 -m src.facility_data validate .
      - run: python3 -m unittest discover -s tests -v
      - name: Produce review diff
        run: |
          git add -N .
          git diff --binary > reports/town-update.diff
      - name: Save generated update for manual review
        uses: actions/upload-artifact@v4
        with:
          name: town-update-${{ inputs.commit }}
          retention-days: 14
          path: |
            data/pinned/
            dist/public/
            reports/town-update.diff
